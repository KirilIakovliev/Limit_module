apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "limitmodule.fullname" . }}
  labels:
    {{- include "limitmodule.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "limitmodule.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if .Values.app.hostPort }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "limitmodule.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.app.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: wait-for-app-schema
          image: {{ include "limitmodule.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /srv
          command: ["python", "-m", "app.wait_db", "load_log"]
          envFrom:
            - configMapRef:
                name: {{ include "limitmodule.fullname" . }}-config
            - secretRef:
                name: {{ include "limitmodule.fullname" . }}-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: {{ include "limitmodule.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "limitmodule.fullname" . }}-config
            - secretRef:
                name: {{ include "limitmodule.fullname" . }}-db
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              {{- if .Values.app.hostPort }}
              hostPort: {{ .Values.app.hostPort }}
              {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 20
            periodSeconds: 3
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
