{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "limitmodule.fullname" . }}
  labels:
    {{- include "limitmodule.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "limitmodule.fullname" . }}
                port:
                  number: {{ .Values.app.port }}
    {{- end }}
    {{- if .Values.ingress.extraHostless }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "limitmodule.fullname" . }}
                port:
                  number: {{ .Values.app.port }}
    {{- end }}
{{- end }}
