apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "limitmodule.fullname" . }}-alembic
  labels:
    {{- include "limitmodule.labels" . | nindent 4 }}
  annotations:
    # post-install: Secret уже в кластере (pre-install хук его не видит).
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.alembic.backoffLimit }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "limitmodule.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: alembic
    spec:
      hostNetwork: {{ .Values.app.hostNetwork }}
      dnsPolicy: {{ .Values.app.dnsPolicy }}
      restartPolicy: OnFailure
      {{- with .Values.app.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: alembic
          image: {{ include "limitmodule.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /srv
          command: ["sh", "-c", "python -m app.wait_db && alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: {{ include "limitmodule.fullname" . }}-config
            - secretRef:
                name: {{ include "limitmodule.fullname" . }}-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
