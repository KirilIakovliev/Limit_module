<script>
/* ============================================================
   Клиент API. Единственное место, которое знает про бэкенд.

   GET /api/companies?q=&limit=
   GET /api/companies/{id}
   GET /api/companies/{id}/indicators
   GET /api/companies/{id}/limits
   GET /api/companies/{id}/sublimits
   GET /api/companies/{id}/reserves
   ============================================================ */
const API = (() => {
  const BASE = (window.APP_CONFIG && window.APP_CONFIG.apiBase) || '/api';
  let offline = false; // переключается в true, если бэкенд не отвечает

  async function call(path) {
    const res = await fetch(BASE + path, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  /* Если бэкенда нет — работаем на демо-данных, чтобы прототип
     можно было открыть без Docker. В проде удалите fallback. */
  async function withFallback(path, mockFn) {
    if (offline) return mockFn();
    try {
      return await call(path);
    } catch (e) {
      if (typeof DemoData === 'undefined') throw e;
      offline = true;
      console.info(
        `[АББ] Бэкенд не отвечает по ${BASE} (${e.message}) — интерфейс переключён на демо-данные. ` +
        'Для работы с реальной базой запустите docker compose up.'
      );
      return mockFn();
    }
  }

  return {
    isOffline: () => offline,
    meta: () => call('/meta').catch(() => null),
    searchCompanies: q =>
      withFallback(`/companies?q=${encodeURIComponent(q)}&limit=8`, () => DemoData.search(q)),
    company: id => withFallback(`/companies/${id}`, () => DemoData.byId(id)),
    profile: id => withFallback(`/companies/${id}/profile`, () => DemoData.profile(id)),
    indicators: id => withFallback(`/companies/${id}/indicators`, () => DemoData.indicators(id)),
    limits: id => withFallback(`/companies/${id}/limits`, () => DemoData.limits(id)),
    sublimits: id => withFallback(`/companies/${id}/sublimits`, () => DemoData.sublimits(id)),
    reserves: id => withFallback(`/companies/${id}/reserves`, () => DemoData.reserves(id)),
  };
})();

</script>
<script>
/* ============================================================
   Минимальный генератор XLSX без внешних библиотек.

   Пишет ZIP методом STORE (без сжатия) — ExcelExport, LibreOffice и
   Google Sheets такой файл открывают штатно. Понадобилось, чтобы
   не тянуть в проект 900 КБ SheetJS с CDN: в закрытом контуре
   CDN обычно недоступен.

   XlsxWriter.build([{name, rows, cols, freeze}]) -> Uint8Array

   Ячейка: число | строка | null | {v, s}
   Стили (s): 1 шапка · 2 деньги · 3 два знака · 4 один знак · 5 заголовок · 6 жирный
   ============================================================ */
const XlsxWriter = (() => {
  const enc = new TextEncoder();

  /* ---------- CRC32 ---------- */
  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[i] = c >>> 0;
    }
    return t;
  })();

  const crc32 = buf => {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };

  /* ---------- ZIP (store) ---------- */
  function zip(files) {
    const parts = [], central = [];
    let offset = 0;

    const now = new Date();
    const time = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() / 2)) & 0xFFFF;
    const date = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

    for (const f of files) {
      const name = enc.encode(f.name);          // имена только ASCII
      const data = enc.encode(f.data);
      const crc = crc32(data);

      const local = new Uint8Array(30 + name.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034B50, true);
      lv.setUint16(4, 20, true);                // version needed
      lv.setUint16(6, 0, true);                 // flags
      lv.setUint16(8, 0, true);                 // method: store
      lv.setUint16(10, time, true);
      lv.setUint16(12, date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true);
      local.set(name, 30);

      parts.push(local, data);

      const cen = new Uint8Array(46 + name.length);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014B50, true);
      cv.setUint16(4, 20, true);                // version made by
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, time, true);
      cv.setUint16(14, date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint32(42, offset, true);
      cen.set(name, 46);
      central.push(cen);

      offset += local.length + data.length;
    }

    const cdSize = central.reduce((s, c) => s + c.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054B50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    const all = [...parts, ...central, end];
    const total = all.reduce((s, p) => s + p.length, 0);
    const out = new Uint8Array(total);
    let p = 0;
    for (const chunk of all) { out.set(chunk, p); p += chunk.length; }
    return out;
  }

  /* ---------- XML ---------- */
  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');

  const colName = i => {
    let s = '';
    for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
    return s;
  };

  function sheetXml(sheet) {
    const cols = sheet.cols
      ? `<cols>${sheet.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>`
      : '';

    const pane = sheet.freeze
      ? `<pane ySplit="${sheet.freeze}" topLeftCell="A${sheet.freeze + 1}" activePane="bottomLeft" state="frozen"/>`
      : '';

    const rows = sheet.rows.map((row, r) => {
      const cells = row.map((cell, c) => {
        if (cell === null || cell === undefined || cell === '') return '';
        const obj = typeof cell === 'object' ? cell : { v: cell };
        const ref = colName(c) + (r + 1);
        const s = obj.s ? ` s="${obj.s}"` : '';
        return typeof obj.v === 'number' && isFinite(obj.v)
          ? `<c r="${ref}"${s}><v>${obj.v}</v></c>`
          : `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${esc(obj.v)}</t></is></c>`;
      }).join('');
      return `<row r="${r + 1}">${cells}</row>`;
    }).join('');

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">${pane}</sheetView></sheetViews>${cols}<sheetData>${rows}</sheetData></worksheet>`;
  }

  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="3"><numFmt numFmtId="164" formatCode="#,##0"/><numFmt numFmtId="165" formatCode="#,##0.00"/><numFmt numFmtId="166" formatCode="0.0"/></numFmts>
<fonts count="3">
<font><sz val="11"/><name val="Calibri"/></font>
<font><b/><sz val="11"/><name val="Calibri"/><color rgb="FF123A63"/></font>
<font><b/><sz val="13"/><name val="Calibri"/><color rgb="FF123A63"/></font>
</fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCE9F5"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top/><bottom style="thin"><color rgb="FF9FBBD6"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="7">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>
<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

  /* ExcelExport не принимает в имени листа : \ / ? * [ ] и больше 31 символа */
  const safeName = (n, i) =>
    (String(n).replace(/[:\\\/?*\[\]]/g, ' ').trim().slice(0, 31)) || `Лист${i + 1}`;

  function build(sheets) {
    const names = [];
    sheets.forEach((s, i) => {
      let n = safeName(s.name, i), k = 2;
      while (names.includes(n)) n = safeName(s.name, i).slice(0, 28) + ' ' + k++;
      names.push(n);
    });

    const files = [
      { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },

      { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },

      { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n, i) => `<sheet name="${esc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },

      { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },

      { name: 'xl/styles.xml', data: STYLES },

      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s) })),
    ];

    return zip(files);
  }

  return { build };
})();

if (typeof module !== 'undefined') module.exports = { XlsxWriter };

</script>
<script>
/* ============================================================
   Выгрузка в ExcelExport. Каждая ветка дерева — отдельный лист:

   Компания · Баланс · Финрезультаты · Коэффициенты ·
   Лимиты · Сублимиты · Резервы

   Выгружаются все данные, загруженные по компании, независимо
   от того, какие вкладки были открыты на экране.
   ============================================================ */
const ExcelExport = (() => {
  const H = 1;   // стиль шапки
  const M = 2;   // #,##0
  const N2 = 3;  // #,##0.00
  const N1 = 4;  // 0.0
  const T = 5;   // заголовок
  const B = 6;   // жирный

  const h = v => ({ v, s: H });
  const money = v => v == null ? '' : { v: Math.round(v), s: M };
  const num2 = v => v == null ? '' : { v: Math.round(v * 100) / 100, s: N2 };
  const num1 = v => v == null ? '' : { v: Math.round(v * 10) / 10, s: N1 };

  const pctChange = (prev, cur) =>
    prev == null || cur == null || !prev ? '' : num1((cur - prev) / Math.abs(prev) * 100);

  /* ---------- Лист «Компания» ---------- */
  function companySheet(c, data, offline) {
    const lim = data.limits, sub = data.sublimits, res = data.reserves;
    const profile = data.profile || {};
    return {
      name: 'Компания',
      cols: [34, 56],
      rows: [
        [{ v: 'Лимитный модуль АББ', s: T }],
        [],
        [{ v: 'Наименование', s: B }, c.name],
        [{ v: 'ИНН', s: B }, c.inn],
        [{ v: 'КПП', s: B }, c.kpp || '—'],
        [{ v: 'ОГРН', s: B }, profile.ogrn || '—'],
        [{ v: 'Адрес', s: B }, profile.address || '—'],
        [{ v: 'ОКВЭД', s: B }, profile.okved ? `${profile.okved} — ${profile.okved_name || ''}` : '—'],
        [{ v: 'Группа компаний', s: B }, profile.group ? profile.group.name : 'Отсутствует'],
        [{ v: 'Отрасль', s: B }, c.industry || '—'],
        [],
        [{ v: 'Установленные лимиты, ₽', s: B }, money(lim.total)],
        [{ v: 'Использовано, ₽', s: B }, money(lim.used)],
        [{ v: 'Свободный остаток, ₽', s: B }, money(lim.total - lim.used)],
        [{ v: 'Сумма сублимитов, ₽', s: B }, money(sub.total)],
        [{ v: 'Сформировано резервов, ₽', s: B }, money(res.total)],
        [],
        [{ v: 'Дата выгрузки', s: B }, new Date().toLocaleString('ru-RU')],
        [{ v: 'Источник данных', s: B }, offline ? 'демо-данные (API недоступен)' : 'база данных'],
      ],
    };
  }

  /* ---------- Листы «Баланс» / «Финрезультаты» / «Коэффициенты» ---------- */
  function indicatorSheet(ind, code, name) {
    const g = ind.groups.find(x => x.code === code);
    if (!g) return null;
    const yrs = ind.years;
    const last = yrs.length - 1;

    const header = [h('Показатель'), ...yrs.map(y => h(String(y))), h(`Δ ${yrs[last]}/${yrs[last - 1]}, %`)];

    const rows = g.rows.map(r => [
      r.label,
      ...r.values.map(v => r.kind === 'money' ? money(v) : r.kind === 'pct' ? num1(v) : num2(v)),
      pctChange(r.values[last - 1], r.values[last]),
    ]);

    const unit = code === 'ratios' ? '' : ' (тыс. ₽)';
    return {
      name,
      freeze: 3,
      cols: [46, 16, 16, 16, 16, 14],
      rows: [[{ v: g.title + unit, s: T }], [], header, ...rows],
    };
  }

  /* ---------- Лист «Лимиты» ---------- */
  const STATUS_TITLES = { active: 'Активный', closed: 'Закрыт', suspended: 'Приостановлен' };

  function limitsSheet(d) {
    const rows = [];
    (d.blocks || []).forEach(block => {
      rows.push([]);
      rows.push([{ v: block.title, s: B }]);
      rows.push([h('Тип лимита'), h('Статус'), h('Валюта'), h('Сумма лимита'),
                 h('Утилизация'), h('Доступный остаток'), h('Совокупный лимит'),
                 h('«Крышка», %'), h('Действует до')]);
      block.items.forEach(item => rows.push([
        item.product, STATUS_TITLES[item.status] || item.status, item.currency,
        money(item.limit_amount), money(item.used_amount), money(item.available),
        money(item.total_limit), num1(item.utilization_cap_pct), item.valid_until || '',
      ]));
    });

    const unified = d.unified || { sublimit: d.total, utilized: d.used, available: d.total - d.used };
    rows.push([]);
    rows.push([{ v: 'Единый сублимит', s: B }]);
    rows.push([{ v: 'Единый сублимит, ₽', s: B }, money(unified.sublimit)]);
    rows.push([{ v: 'Единый доступный сублимит, ₽', s: B }, money(unified.available)]);
    rows.push([{ v: 'Единый утилизированный сублимит, ₽', s: B }, money(unified.utilized)]);

    return {
      name: 'Лимиты',
      cols: [38, 16, 10, 18, 18, 18, 18, 12, 14],
      rows: [[{ v: 'Установленные лимиты, ₽', s: T }], ...rows],
    };
  }

  /* ---------- Лист «Заявки на рассмотрении» ---------- */
  function applicationsSheet(applications) {
    if (!applications || !applications.length) return null;
    return {
      name: 'Заявки на рассмотрении',
      freeze: 3,
      cols: [38, 20, 10, 14, 20, 46],
      rows: [
        [{ v: 'Заявки на рассмотрении', s: T }], [],
        [h('Тип лимита'), h('Статус лимита'), h('Валюта'), h('Срок, мес.'),
         h('Запрошенная сумма'), h('Комментарии')],
        ...applications.map(item => [
          item.product, item.status, item.currency, item.term_months,
          money(item.amount), item.comment || '',
        ]),
      ],
    };
  }

  /* ---------- Лист «Сублимиты» ---------- */
  function sublimitsSheet(d) {
    const rows = d.items.map(x => [
      x.product, x.name, money(x.amount), money(x.used_amount), money(x.available),
      x.tenor_months, num1(x.used_amount / x.amount * 100),
    ]);
    return {
      name: 'Сублимиты',
      freeze: 3,
      cols: [38, 26, 18, 18, 18, 12, 14],
      rows: [
        [{ v: 'Сублимиты, ₽', s: T }], [],
        [h('Продукт'), h('Сублимит'), h('Сумма'), h('Использовано'), h('Доступно'), h('Срок, мес.'), h('Утилизация, %')],
        ...rows,
        [],
        [{ v: 'Итого', s: B }, '', money(d.total), money(d.used), money(d.total - d.used)],
      ],
    };
  }

  /* ---------- Лист «Группа компаний» ---------- */
  function groupSheet(group) {
    if (!group) return null;
    const rows = group.members.map(member => [
      member.name, member.inn,
      money(member.sublimit_amount), money(member.available_amount), money(member.utilized_amount),
    ]);
    return {
      name: 'Группа компаний',
      freeze: 10,
      cols: [40, 18, 26, 26, 30],
      rows: [
        [{ v: group.name, s: T }], [],
        [{ v: 'Единый лимит', s: B }],
        [{ v: 'Сумма единого лимита, ₽', s: B }, money(group.unified_limit)],
        [{ v: 'Единый доступный лимит, ₽', s: B }, money(group.available_limit)],
        [{ v: 'Единый утилизированный лимит, ₽', s: B }, money(group.utilized_limit)],
        [{ v: 'Совокупный лимит, ₽', s: B }, money(group.total_limit)],
        [{ v: '«Крышка» по утилизации, %', s: B }, num1(group.utilization_cap_pct)],
        [],
        [h('Наименование клиента'), h('ИНН'), h('Сумма единого сублимита'),
         h('Единый доступный сублимит'), h('Единый утилизированный сублимит')],
        ...rows,
      ],
    };
  }

  /* ---------- Лист «Информация о резервах» ---------- */
  function reservesSheet(d) {
    const rows = [];
    (d.blocks || []).forEach(block => {
      rows.push([]);
      rows.push([{ v: `${block.title} — ${Math.round(block.total)} ₽`, s: B }]);
      rows.push([h('Название продукта'), h('Валюта лимита'), h('Сумма лимита'),
                 h('Срок лимита, мес.'), h('Сумма резерва'), h('Ставка, %')]);
      block.items.forEach(item => rows.push([
        item.product, item.currency, money(item.limit_amount),
        item.term_months, money(item.reserve_amount),
        num2(item.limit_amount ? item.reserve_amount / item.limit_amount * 100 : 0),
      ]));
    });

    return {
      name: 'Информация о резервах',
      cols: [40, 16, 20, 18, 20, 12],
      rows: [[{ v: 'Информация о резервах, ₽', s: T }], ...rows,
             [], [{ v: 'Итого сформировано, ₽', s: B }, money(d.total)]],
    };
  }

  /* ---------- сборка и скачивание ---------- */
  function build(company, data, offline) {
    return XlsxWriter.build([
      companySheet(company, data, offline),
      groupSheet(data.profile && data.profile.group),
      indicatorSheet(data.indicators, 'balance', 'Баланс'),
      indicatorSheet(data.indicators, 'results', 'Финрезультаты'),
      indicatorSheet(data.indicators, 'ratios', 'Коэффициенты'),
      limitsSheet(data.limits),
      applicationsSheet(data.limits.applications),
      sublimitsSheet(data.sublimits),
      reservesSheet(data.reserves),
    ].filter(Boolean));
  }

  function download(company, data, offline) {
    const bytes = build(company, data, offline);
    const blob = new Blob([bytes], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `АББ_${company.inn}_${new Date().toISOString().slice(0, 10)}.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { build, download };
})();

if (typeof module !== 'undefined') module.exports = { ExcelExport };

</script>
<script>
/* ============================================================
   События: отклонения, на которые стоит обратить внимание.

   Считаются на уже загруженных данных компании — отдельный запрос
   к базе не нужен. Когда правила станут настраиваемыми (пороги на
   отрасль, веса, история решений), их место — на бэкенде.

   Events.detect({indicators, limits, sublimits, reserves}) -> [событие]

   Событие: { level, title, detail, source, period }
   level: critical | warning | positive | info
   ============================================================ */
const Events = (() => {

  /* Для каких показателей рост — это хорошо, а для каких — тревожный сигнал */
  const DIRECTION = {
    'Выручка': 'up-good',
    'Чистая прибыль': 'up-good',
    'Прибыль от продаж': 'up-good',
    'Валовая прибыль': 'up-good',
    'Прибыль до налогообложения': 'up-good',
    'Денежные средства и эквиваленты': 'up-good',
    'Капитал и резервы': 'up-good',
    'Активы, всего': 'up-good',
    'Оборотные активы': 'up-good',
    'Краткосрочные обязательства': 'up-bad',
    'Долгосрочные обязательства': 'up-bad',
    'Себестоимость продаж': 'up-bad',
    'Дебиторская задолженность': 'up-bad',
    'Коммерческие и управленческие расходы': 'up-bad',
  };

  /* Пороговые значения коэффициентов */
  const RATIO_RULES = {
    'Текущая ликвидность': {
      min: 1.0, level: 'critical',
      message: v => `Текущая ликвидность ${fmt(v)} — оборотных активов не хватает на покрытие краткосрочных обязательств`,
    },
    'Коэффициент автономии': {
      min: 0.3, level: 'warning',
      message: v => `Коэффициент автономии ${fmt(v)} — доля собственных средств ниже 30%`,
    },
    'Рентабельность продаж': {
      min: 0, level: 'critical',
      message: v => `Рентабельность продаж ${fmt(v)}% — деятельность убыточна`,
    },
    'Долг / Чистая прибыль': {
      max: 5, level: 'warning',
      message: v => `Долговая нагрузка ${fmt(v)} годовых прибылей — обслуживание долга под давлением`,
    },
  };

  const SIGNIFICANT = 25;   // % отклонения, с которого показатель попадает в события
  const SEVERE = 50;        // % отклонения, считающегося резким

  /* События строятся ТОЛЬКО по текущему периоду: последний год в отчётности
     сравнивается с предыдущим и с медианой всей предыдущей истории.
     Отклонения между прошлыми годами уже отработаны и в список не попадают.
     Когда появятся квартальные и месячные данные, «текущим периодом» станет
     последний доступный срез — логика сравнения не изменится. */

  const fmt = v => Number(v).toFixed(2).replace('.', ',');
  const pct = v => Math.abs(v).toFixed(1).replace('.', ',');

  /* ---------- медиана предыдущих периодов ----------
     Сравнение с одним прошлым годом даёт ложные срабатывания, когда
     тот год сам был выбросом. Медиана всей истории устойчивее. */
  function median(values) {
    const clean = values.filter(v => typeof v === 'number' && isFinite(v)).sort((a, b) => a - b);
    if (!clean.length) return null;
    const mid = Math.floor(clean.length / 2);
    return clean.length % 2 ? clean[mid] : (clean[mid - 1] + clean[mid]) / 2;
  }

  /* ---------- отклонения в показателях ---------- */
  function fromIndicators(data) {
    const found = [];
    const years = data.years;
    if (!years || years.length < 2) return found;

    const lastYear = years[years.length - 1];
    const prevYear = years[years.length - 2];

    data.groups.forEach(group => {
      group.rows.forEach(row => {
        const values = row.values;
        const current = values[values.length - 1];
        const previous = values[values.length - 2];

        // --- пороги для коэффициентов
        const rule = RATIO_RULES[row.label];
        if (rule && typeof current === 'number') {
          const broken = (rule.min !== undefined && current < rule.min)
                      || (rule.max !== undefined && current > rule.max);
          if (broken) {
            found.push({
              level: rule.level,
              title: row.label,
              detail: rule.message(current),
              source: group.title,
              period: String(lastYear),
              weight: rule.level === 'critical' ? 100 : 70,
            });
          }
        }

        // --- резкие изменения год к году
        if (row.kind !== 'money') return;
        if (typeof current !== 'number' || typeof previous !== 'number' || previous === 0) return;

        const changeYoY = (current - previous) / Math.abs(previous) * 100;
        if (Math.abs(changeYoY) < SIGNIFICANT) return;

        const base = median(values.slice(0, -1));
        const changeVsHistory = base ? (current - base) / Math.abs(base) * 100 : changeYoY;

        const direction = DIRECTION[row.label] || 'up-good';
        const rising = changeYoY > 0;
        const good = (direction === 'up-good') === rising;
        const severe = Math.abs(changeYoY) >= SEVERE;

        found.push({
          level: good ? 'positive' : (severe ? 'critical' : 'warning'),
          title: `${row.label}: ${rising ? 'рост' : 'снижение'} на ${pct(changeYoY)}%`,
          detail: `${prevYear} → ${lastYear}: ${Format.money(previous)} → ${Format.money(current)} тыс. ₽` +
                  (base ? `. Отклонение от медианы за ${years[0]}–${prevYear}: ${changeVsHistory > 0 ? '+' : '−'}${pct(changeVsHistory)}%` : ''),
          source: group.title,
          period: `${prevYear} → ${lastYear}`,
          weight: Math.min(Math.abs(changeYoY), 99) + (good ? 0 : 20),
        });
      });
    });

    return found;
  }

  /* ---------- лимиты: утилизация и сроки ---------- */
  function fromLimits(data) {
    const found = [];
    const soonDays = 90;
    const now = new Date();

    data.items.forEach(item => {
      const used = item.limit_amount ? item.used_amount / item.limit_amount * 100 : 0;

      if (used >= 100) {
        found.push({
          level: 'critical', title: `${item.product}: лимит выбран полностью`,
          detail: `Использовано ${Format.compact(item.used_amount)} из ${Format.compact(item.limit_amount)}`,
          source: 'Лимиты', period: 'текущий', weight: 110,
        });
      } else if (used >= 90) {
        found.push({
          level: 'warning', title: `${item.product}: утилизация ${used.toFixed(1).replace('.', ',')}%`,
          detail: `Свободный остаток ${Format.compact(item.available)}`,
          source: 'Лимиты', period: 'текущий', weight: 80,
        });
      }

      if (item.valid_until) {
        const days = Math.round((new Date(item.valid_until) - now) / 86400000);
        if (days >= 0 && days <= soonDays) {
          found.push({
            level: 'warning', title: `${item.product}: срок действия истекает`,
            detail: `Осталось ${days} дн. — до ${Format.date(item.valid_until)}`,
            source: 'Лимиты', period: Format.date(item.valid_until), weight: 85,
          });
        }
      }
    });

    return found;
  }

  /* ---------- резервы ----------
     Сигнал — высокая ставка резервирования: отношение суммы резерва
     к сумме лимита. По МСФО она выше по определению, поэтому порог
     для каждого стандарта свой. */
  const RESERVE_THRESHOLD = { rsbu: 7, ifrs: 9 };

  function fromReserves(data) {
    const items = data.items || [];
    return items
      .map(item => ({
        item,
        rate: item.limit_amount ? item.reserve_amount / item.limit_amount * 100 : 0,
      }))
      .filter(({ item, rate }) => rate >= (RESERVE_THRESHOLD[item.standard] || 10))
      .map(({ item, rate }) => ({
        level: 'warning',
        title: `Повышенная ставка резервирования: ${rate.toFixed(2).replace('.', ',')}%`,
        detail: `${item.product} — резерв ${Format.compact(item.reserve_amount)} ` +
                `при лимите ${Format.compact(item.limit_amount)}`,
        source: item.standard === 'ifrs' ? 'Резервы МСФО' : 'Резервы РСБУ',
        period: Format.date(item.calc_date),
        weight: 70 + rate,
      }));
  }

  /* ---------- сборка ---------- */
  function detect(data) {
    const all = [
      ...fromIndicators(data.indicators),
      ...fromLimits(data.limits),
      ...fromReserves(data.reserves),
    ];
    // сначала самое важное; вес учитывает и величину отклонения, и знак
    const rank = { critical: 3, warning: 2, positive: 1, info: 0 };
    all.sort((a, b) => rank[b.level] - rank[a.level] || b.weight - a.weight);
    return all;
  }

  const countBy = (list, level) => list.filter(event => event.level === level).length;

  return { detect, countBy };
})();

</script>
<script>
/* ============================================================
   Рендер таблиц. Каждая функция возвращает HTML-строку.
   ============================================================ */
const TableViews = (() => {

  const head = (title, meta) =>
    `<div class="content-head"><h2>${Format.escape(title)}</h2>${meta ? `<span class="content-meta">${meta}</span>` : ''}</div>`;

  const card = (k, v, accent) =>
    `<div class="card${accent ? ' is-accent' : ''}"><div class="card-key">${k}</div><div class="card-value">${v}</div></div>`;

  const usageBar = (used, total) => {
    const p = total ? Math.min(100, used / total * 100) : 0;
    return `<div class="usage-bar"><i style="width:${p.toFixed(1)}%"></i></div>`;
  };

  /* ---------- Основная информация: баланс / финрезультаты / коэффициенты ---------- */
  function indicators(data, groupCode) {
    const g = data.groups.find(x => x.code === groupCode);
    if (!g) return '<p class="events-empty">Нет данных</p>';
    const yrs = data.years;

    const rows = g.rows.map(r => {
      const prev = r.values[r.values.length - 2];
      const cur = r.values[r.values.length - 1];
      return `<tr><td>${Format.escape(r.label)}</td>` +
        r.values.map(v => `<td>${Format.byKind(v, r.kind)}</td>`).join('') +
        `<td>${Format.delta(prev, cur)}</td></tr>`;
    }).join('');

    return head(g.title, `период ${yrs[0]}–${yrs[yrs.length - 1]} · ${data.unit}`) +
      `<div class="table-wrap"><table>
        <thead><tr><th>Показатель</th>${yrs.map(y => `<th>${y}</th>`).join('')}<th>Δ ${yrs[yrs.length - 1]}/${yrs[yrs.length - 2]}</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  /* ---------- Лимиты ----------
     Два раздела: установленные лимиты (корпоративный и инвестиционный
     блоки плюс единый сублимит клиента) и заявки на рассмотрении.
     Единый сублимит не хранится отдельно — по глоссарию это совокупность
     лимитов обоих блоков, установленных на клиента. */
  const STATUS_TITLES = { active: 'Активный', closed: 'Закрыт', suspended: 'Приостановлен' };

  function limitBlock(block) {
    const rows = block.items.map(item => `<tr>
        <td>${Format.escape(item.product)}</td>
        <td><span class="badge">${Format.escape(STATUS_TITLES[item.status] || item.status)}</span></td>
        <td>${Format.escape(item.currency)}</td>
        <td>${Format.rub(item.limit_amount)}</td>
        <td>${Format.rub(item.used_amount)}</td>
        <td>${Format.rub(item.available)}</td>
        <td>${Format.rub(item.total_limit)}</td>
        <td>${Number(item.utilization_cap_pct).toFixed(0)}<span class="unit">%</span></td>
      </tr>`).join('');

    return `<h4 class="sub-title">${Format.escape(block.title)}</h4>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Тип лимита</th><th>Статус лимита</th><th>Валюта</th><th>Сумма лимита</th>
          <th>Утилизация лимита</th><th>Доступный остаток</th>
          <th>Совокупный лимит</th><th>«Крышка»</th>
        </tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  function applicationsBlock(applications) {
    if (!applications.length) {
      return `<h3 class="block-title">Заявки на рассмотрении</h3>
              <p class="events-empty">Заявок на рассмотрении нет.</p>`;
    }
    const rows = applications.map(item => `<tr>
        <td>${Format.escape(item.product)}</td>
        <td><span class="badge is-pending">${Format.escape(item.status)}</span></td>
        <td>${Format.escape(item.currency)}</td>
        <td>${item.term_months} мес.</td>
        <td>${Format.rub(item.amount)}</td>
        <td class="comment-cell">${Format.escape(item.comment || '—')}</td>
      </tr>`).join('');

    return `<h3 class="block-title">Заявки на рассмотрении</h3>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Тип лимита</th><th>Статус лимита</th><th>Валюта</th>
          <th>Срок лимита</th><th>Запрошенная сумма</th><th>Комментарии</th>
        </tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  function limits(d) {
    const blocks = d.blocks || [];
    const unified = d.unified || { sublimit: d.total, utilized: d.used, available: d.total - d.used };
    const utilization = unified.sublimit ? unified.utilized / unified.sublimit * 100 : 0;

    return head('Лимиты', `установленные лимиты и заявки · валюта ₽`) +
      `<h3 class="block-title">Установленные лимиты</h3>
       ${blocks.map(limitBlock).join('')}

       <h4 class="sub-title">Единый сублимит</h4>
       <div class="cards">
         ${card('Единый сублимит', Format.compact(unified.sublimit), true)}
         ${card('Единый доступный сублимит', Format.compact(unified.available))}
         ${card('Единый утилизированный сублимит', Format.compact(unified.utilized))}
       </div>
       ${usageBar(unified.utilized, unified.sublimit)}
       <p class="bar-note">Утилизация ${utilization.toFixed(1).replace('.', ',')}% от единого сублимита</p>

       ${applicationsBlock(d.applications || [])}`;
  }

  /* ---------- Сублимиты ---------- */
  function sublimits(d) {
    let last = null;
    const rows = d.items.map(x => {
      const group = x.product !== last
        ? `<tr class="group-row"><td colspan="6">${Format.escape(x.product)}</td></tr>` : '';
      last = x.product;
      return group + `<tr>
        <td>${Format.escape(x.name)}</td>
        <td>${Format.rub(x.amount)}</td>
        <td>${Format.rub(x.used_amount)}</td>
        <td>${Format.rub(x.available)}</td>
        <td>${x.tenor_months} мес.</td>
        <td>${(x.used_amount / x.amount * 100).toFixed(1).replace('.', ',')}<span class="unit">%</span></td>
      </tr>`;
    }).join('');

    return head('Сублимиты', `${d.items.length} позиций`) +
      `<div class="cards">
        ${card('Сумма сублимитов', Format.compact(d.total), true)}
        ${card('Использовано', Format.compact(d.used))}
        ${card('Свободно', Format.compact(d.total - d.used))}
      </div>
      ${usageBar(d.used, d.total)}
      <div class="table-wrap"><table>
        <thead><tr><th>Сублимит</th><th>Сумма</th><th>Использовано</th><th>Доступно</th><th>Срок</th><th>Утилизация</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  /* ---------- Информация о резервах ----------
     Два блока по стандартам учёта: РСБУ и МСФО. Внутри — название
     продукта, валюта и сумма лимита, срок лимита и сумма резерва.
     Наименование клиента выводится в правом верхнем углу раздела. */
  function reserveBlock(block) {
    const rows = block.items.map(item => `<tr>
        <td>${Format.escape(item.product)}</td>
        <td>${Format.escape(item.currency)}</td>
        <td>${Format.rub(item.limit_amount)}</td>
        <td>${item.term_months} мес.</td>
        <td>${Format.rub(item.reserve_amount)}</td>
        <td>${(item.reserve_amount / item.limit_amount * 100).toFixed(2).replace('.', ',')}<span class="unit">%</span></td>
      </tr>`).join('');

    return `<h3 class="block-title">${Format.escape(block.title)} · ${Format.compact(block.total)}</h3>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Название продукта</th><th>Валюта лимита</th><th>Сумма лимита</th>
          <th>Срок лимита</th><th>Сумма резерва</th><th>Ставка резервирования</th>
        </tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  function reserves(d) {
    const blocks = d.blocks || [];
    if (!blocks.length) {
      return head('Информация о резервах', '') +
        '<p class="events-empty">Позиции резервов не заведены.</p>';
    }

    return head('Информация о резервах', `сформировано ${Format.compact(d.total)}`) +
      blocks.map(reserveBlock).join('');
  }

  /* ---------- События ----------
     Список фильтруется вкладками второго уровня; сами вкладки строит tab-tree.js */
  const EVENT_LABEL = {
    critical: 'Требует внимания',
    warning: 'Наблюдение',
    positive: 'Положительная динамика',
    info: 'Информация',
  };

  const FILTER_TITLE = {
    critical: 'Требуют внимания',
    warning: 'Наблюдение',
    positive: 'Положительная динамика',
  };

  function events(list, filter) {
    const visible = filter ? list.filter(event => event.level === filter) : list;
    const period = list.length ? list[0].period : '';

    if (!visible.length) {
      return head(FILTER_TITLE[filter] || 'События', 'за текущий период') +
        `<p class="events-empty">Событий нет.</p>`;
    }

    const items = visible.map(event => `
      <li class="event event--${event.level}">
        <span class="event-marker"></span>
        <div class="event-body">
          <div class="event-head">
            <span class="event-title">${Format.escape(event.title)}</span>
            <span class="event-tag">${EVENT_LABEL[event.level]}</span>
          </div>
          <div class="event-detail">${Format.escape(event.detail)}</div>
          <div class="event-source">${Format.escape(event.source)} · ${Format.escape(event.period)}</div>
        </div>
      </li>`).join('');

    return head(FILTER_TITLE[filter] || 'События',
                `${visible.length} за текущий период${period ? ' · ' + Format.escape(period) : ''}`) +
      `<ul class="events">${items}</ul>`;
  }

  /* ---------- Основная информация: структура группы компаний ----------
     Сетка из пяти колонок: верхняя строка — показатели единого лимита
     группы, ниже по строке на каждую компанию. Все карточки справочные,
     кликов по ним нет. Термины — по глоссарию: единый лимит включает
     корпоративный и инвестиционный блоки, сублимит — часть единого
     лимита, установленная на конкретного клиента. */
  const groupCell = (label, value, accent) => `
    <div class="group-cell${accent ? ' is-accent' : ''}">
      ${label ? `<span class="cell-label">${Format.escape(label)}</span>` : ''}
      <span class="cell-value">${value}</span>
    </div>`;

  /* Кликается только наименование — по нему выбирают компанию для перехода.
     Компания, карточка которой открыта сейчас, остаётся справочной. */
  const selectableCell = (label, value, member, selected) => `
    <button type="button"
            class="group-cell is-selectable${selected ? ' is-selected' : ''}"
            data-company-id="${member.id}"
            aria-pressed="${selected}">
      <span class="cell-label">${Format.escape(label)}</span>
      <span class="cell-value">${Format.escape(value)}</span>
    </button>`;

  const currentCell = (label, value) => `
    <div class="group-cell is-current">
      <span class="cell-label">${Format.escape(label)}</span>
      <span class="cell-value">${Format.escape(value)}</span>
      <span class="cell-note">текущая компания</span>
    </div>`;

  function group(data, options = {}) {
    const { selectedId = null, currentId = null } = options;
    const utilization = data.unified_limit
      ? data.utilized_limit / data.unified_limit * 100 : 0;

    const limitRow = `
      <div class="group-grid">
        ${groupCell('Сумма единого лимита', Format.compact(data.unified_limit), true)}
        ${groupCell('Единый доступный лимит', Format.compact(data.available_limit))}
        ${groupCell('Единый утилизированный лимит', Format.compact(data.utilized_limit))}
        ${groupCell('Совокупный лимит', Format.compact(data.total_limit))}
        ${groupCell('«Крышка» по утилизации', Number(data.utilization_cap_pct).toFixed(0) + '%')}
      </div>`;

    const headings = ['Компания', 'ИНН', 'Единый сублимит',
                      'Единый доступный сублимит', 'Единый утилизированный сублимит'];


    // подписи в карточках компаний дублируют шапку и скрыты на широком
    // экране — на узком шапка прячется, и подписи становятся видны
    // текущая компания всегда первой строкой
    const ordered = [...data.members].sort((a, b) =>
      (b.id === currentId) - (a.id === currentId) || b.sublimit_amount - a.sublimit_amount);

    // кнопка перехода встаёт отдельной строкой сразу под выбранной компанией
    // и раздвигает остальные строки вниз; сетка та же, поэтому кнопка
    // оказывается ровно под карточкой с наименованием
    const goRow = id => id !== selectedId ? '' : `
      <div class="go-row">
        <div class="go-cell">
          <button type="button" class="go-button" data-go="${id}">Перейти</button>
        </div>
      </div>`;

    const memberRows = ordered.map(member => `
      <div class="group-grid group-grid--members">
        ${member.id === currentId
            ? currentCell(headings[0], member.name)
            : selectableCell(headings[0], member.name, member, member.id === selectedId)}
        ${groupCell(headings[1], Format.escape(member.inn))}
        ${groupCell(headings[2], Format.compact(member.sublimit_amount))}
        ${groupCell(headings[3], Format.compact(member.available_amount))}
        ${groupCell(headings[4], Format.compact(member.utilized_amount))}
      </div>
      ${goRow(member.id)}`).join('');

    return head(data.name, `Компаний в структуре: ${data.members.length}`) +
      `<h3 class="block-title">Единый лимит</h3>
       ${limitRow}
       ${usageBar(data.utilized_limit, data.unified_limit)}
       <p class="bar-note">Утилизация ${utilization.toFixed(1).replace('.', ',')}% при «крышке»
          ${Number(data.utilization_cap_pct).toFixed(0)}%</p>

       <div class="block-head">
         <h3 class="block-title">Компании в структуре ГК</h3>
         <span class="block-hint">Выберите наименование компании, чтобы перейти к её карточке</span>
       </div>
       <div class="group-grid group-grid--head">
         ${headings.map(title => `<span>${Format.escape(title)}</span>`).join('')}
       </div>
       ${memberRows}`;
  }

  /* ---------- Основная информация: атрибутный состав ---------- */
  function profile(data) {
    const attributes = [
      ['Наименование компании', data.name],
      ['ИНН', data.inn],
      ['ОГРН', data.ogrn || '—'],
      ['КПП', data.kpp || '—'],
      ['Адрес', data.address || '—'],
      ['ОКВЭД', data.okved ? `${data.okved} — ${data.okved_name || ''}` : '—'],
      ['Группа компаний', data.group ? data.group.name : 'Отсутствует'],
    ];
    const rows = attributes.map(([key, value]) =>
      `<tr><td>${Format.escape(key)}</td><td class="value-cell">${Format.escape(value)}</td></tr>`).join('');

    return head('Основная информация', '') +
      `<div class="table-wrap"><table>
        <thead><tr><th>Атрибут</th><th>Значение</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  return { indicators, limits, sublimits, reserves, events, group, profile };
})();

</script>
<script>
/* ============================================================
   Поисковая строка: подсказки после 3 символов, по названию и ИНН.
   Наружу отдаёт onSelect(company) и onSubmit(company).
   ============================================================ */
const SearchBar = (() => {
  const byId = id => document.getElementById(id);

  const input = byId('searchInput'),
        field = byId('searchField'),
        dropdown = byId('suggestionList'),
        submitButton = byId('searchButton'),
        hint = byId('searchHint'),
        clearButton = byId('clearButton');

  let suggestions = [];        // компании, показанные в выпадающем списке
  let highlightedIndex = -1;   // подсвеченная строка списка
  let selectedCompany = null;  // компания, выбранная пользователем
  let requestCounter = 0;      // номер запроса, чтобы отбрасывать устаревшие ответы
  let debounceTimer = null;

  const callbacks = { select: () => {}, submit: () => {} };

  /* ---------- ввод ---------- */
  input.addEventListener('focus', () => field.classList.add('is-focused'));
  input.addEventListener('blur', () => field.classList.remove('is-focused'));

  input.addEventListener('input', () => {
    field.classList.toggle('has-text', input.value.length > 0);
    if (selectedCompany && input.value !== selectedCompany.name && input.value !== selectedCompany.inn) {
      clearSelection();
    }
    const text = input.value.trim();
    clearTimeout(debounceTimer);

    if (text.length < 3) {
      closeDropdown();
      hint.textContent = 'Введите не менее 3 символов';
      return;
    }
    hint.textContent = 'Выберите компанию из списка';
    debounceTimer = setTimeout(() => loadSuggestions(text), 160);
  });

  async function loadSuggestions(text) {
    const requestId = ++requestCounter;
    let result = [];
    try { result = await API.searchCompanies(text); } catch { result = []; }
    if (requestId !== requestCounter) return;   // ответ устарел — пользователь допечатал
    suggestions = result;
    highlightedIndex = -1;
    renderDropdown(text);
  }

  function renderDropdown(text) {
    if (!suggestions.length) {
      dropdown.innerHTML = '<div class="suggestions-empty">Ничего не найдено — проверьте написание или введите ИНН</div>';
      openDropdown();
      return;
    }
    dropdown.innerHTML = suggestions.map((company, i) => `
      <div class="suggestion" role="option" id="suggestion${i}" aria-selected="false" data-index="${i}">
        <span class="suggestion-dot"></span>
        <span>
          <span class="suggestion-name">${highlightMatch(company.name, text)}</span>
          <span class="suggestion-meta">ИНН ${highlightMatch(company.inn, text)} · КПП ${Format.escape(company.kpp || '—')} · ${Format.escape(company.industry || '')}</span>
        </span>
      </div>`).join('');

    dropdown.querySelectorAll('.suggestion').forEach(node => {
      node.addEventListener('mousedown', event => {
        event.preventDefault();
        selectCompany(suggestions[+node.dataset.index]);
      });
      node.addEventListener('mouseenter', () => highlight(+node.dataset.index));
    });
    openDropdown();
  }

  function highlightMatch(value, text) {
    const position = Format.normalize(value).indexOf(Format.normalize(text));
    if (position < 0) return Format.escape(value);
    return Format.escape(value.slice(0, position)) +
           '<b>' + Format.escape(value.slice(position, position + text.length)) + '</b>' +
           Format.escape(value.slice(position + text.length));
  }

  const openDropdown = () => {
    dropdown.classList.add('is-open');
    input.setAttribute('aria-expanded', 'true');
  };

  const closeDropdown = () => {
    dropdown.classList.remove('is-open');
    input.setAttribute('aria-expanded', 'false');
    highlightedIndex = -1;
  };

  function highlight(index) {
    highlightedIndex = index;
    dropdown.querySelectorAll('.suggestion').forEach((node, i) =>
      node.setAttribute('aria-selected', i === index));
    const active = dropdown.querySelector('#suggestion' + index);
    if (active) active.scrollIntoView({ block: 'nearest' });
    input.setAttribute('aria-activedescendant', 'suggestion' + index);
  }

  /* ---------- клавиатура ---------- */
  input.addEventListener('keydown', event => {
    const isOpen = dropdown.classList.contains('is-open');
    if (event.key === 'ArrowDown' && isOpen) {
      event.preventDefault();
      highlight((highlightedIndex + 1) % suggestions.length);
    } else if (event.key === 'ArrowUp' && isOpen) {
      event.preventDefault();
      highlight((highlightedIndex - 1 + suggestions.length) % suggestions.length);
    } else if (event.key === 'Enter') {
      event.preventDefault();
      if (isOpen && highlightedIndex > -1) selectCompany(suggestions[highlightedIndex]);
      else if (selectedCompany) callbacks.submit(selectedCompany);
    } else if (event.key === 'Escape') {
      closeDropdown();
    }
  });

  document.addEventListener('click', event => {
    if (!event.target.closest('.search-area')) closeDropdown();
  });

  /* ---------- выбор компании ---------- */
  function selectCompany(company) {
    selectedCompany = company;
    input.value = company.name;
    field.classList.add('has-text');
    closeDropdown();
    submitButton.disabled = false;
    hint.textContent = 'Компания выбрана — нажмите «Поиск»';
    callbacks.select(company);
  }

  function clearSelection() {
    selectedCompany = null;
    submitButton.disabled = true;
  }

  function reset() {
    input.value = '';
    field.classList.remove('has-text');
    clearSelection();
    closeDropdown();
    hint.textContent = 'Введите не менее 3 символов';
    input.focus();
  }

  clearButton.addEventListener('click', reset);
  submitButton.addEventListener('click', () => {
    if (selectedCompany) callbacks.submit(selectedCompany);
  });

  return {
    onSelect: fn => { callbacks.select = fn; },
    onSubmit: fn => { callbacks.submit = fn; },
    getSelected: () => selectedCompany,
    setBusy: busy => { submitButton.disabled = busy || !selectedCompany; },
    reset,
  };
})();

</script>
<script>
/* ============================================================
   Дерево вкладок.

   Уровень 1   Компания · ИНН · КПП · События
   Уровень 2   Основная информация · Лимиты · Сублимиты · Резервы
   Уровень 3   Баланс · Финрезультаты · Коэффициенты

   Вкладки создаются один раз на загрузку компании, дальше меняются
   только классы — иначе анимация появления повторялась бы на каждый клик.
   ============================================================ */
const TabTree = (() => {
  const byId = id => document.getElementById(id);

  const treeRoot = byId('tabTree'),
        companyLevel = byId('companyLevel'),
        sectionLevel = byId('sectionLevel'),
        groupLevel = byId('groupLevel'),
        companyTabs = byId('companyTabs'),
        sectionTabs = byId('sectionTabs'),
        groupTabs = byId('groupTabs'),
        contentArea = byId('panelContent');

  const arrowLeft = treeRoot.querySelector('.row-arrow--left');
  const arrowRight = treeRoot.querySelector('.row-arrow--right');

  const state = {
    company: null,
    data: null,
    events: [],
    view: null,          // 'company' | 'events' — что выбрано на первом уровне
    section: null,       // 'main' | 'statements' | 'limits' | 'sublimits' | 'reserves'
    group: 'balance',    // 'balance' | 'results' | 'ratios'
    attribute: null,     // выбранный атрибут в «Основной информации» ('group' раскрывает ГК)
    groupSelection: null, // компания, выбранная в структуре ГК для перехода
    eventFilter: 'critical',  // какая категория событий показана
  };

  const tabNodes = {
    company: null, events: null, sections: {}, groups: {},
    eventFilters: {}, attributes: {},
  };

  const callbacks = { openCompany: () => {} };

  const EVENT_FILTERS = [
    { code: 'critical', label: 'Требуют внимания', note: 'резкие отклонения' },
    { code: 'warning',  label: 'Наблюдение',       note: 'умеренные изменения' },
    { code: 'positive', label: 'Положительная динамика', note: 'улучшение показателей' },
  ];

  const INDICATOR_GROUPS = [
    { code: 'balance', title: 'Баланс' },
    { code: 'results', title: 'Фин. результаты' },
    { code: 'ratios',  title: 'Коэффициенты' },
  ];

  /* ---------- конструктор вкладки ---------- */
  function createTab({ label, labelFlag, value, note, isStatic, index = 0, onClick }) {
    const node = document.createElement(isStatic ? 'div' : 'button');
    node.className = 'tab' + (isStatic ? ' is-static' : '');
    node.style.animationDelay = index * 45 + 'ms';
    if (!isStatic) {
      node.type = 'button';
      node.addEventListener('click', onClick);
    }
    node.innerHTML =
      (label ? `<span class="tab-label">${Format.escape(label)}` +
               (labelFlag ? ` <i class="tab-flag">${Format.escape(labelFlag)}</i>` : '') +
               `</span>` : '') +
      `<span class="tab-value">${Format.escape(value)}</span>` +
      `<span class="tab-note">${note || ''}</span>`;
    node.noteElement = node.querySelector('.tab-note');
    return node;
  }

  /* ИНН и КПП живут одним серым блоком: это реквизиты одной компании,
     дробить их на две карточки незачем. Блок отделён от боковых вкладок
     короткими вертикальными линиями. */
  function createIdentityPair(company) {
    const pair = document.createElement('div');
    pair.className = 'tab-pair';
    [['ИНН', company.inn], ['КПП', company.kpp || '—']].forEach(([label, value]) => {
      const cell = document.createElement('div');
      cell.className = 'tab-cell';
      cell.innerHTML = `<span class="tab-label">${Format.escape(label)}</span>` +
                       `<span class="tab-value">${Format.escape(value)}</span>`;
      pair.append(cell);
    });
    return pair;
  }

  /* ---------- построение уровней ---------- */
  function buildTabs() {
    const company = state.company;
    const { indicators, limits, sublimits, reserves, profile } = state.data;

    // --- уровень 1
    tabNodes.company = createTab({
      label: 'Компания', value: company.name, note: 'Открыть карточку',
      index: 0, onClick: () => selectView('company'),
    });
    tabNodes.company.classList.add('tab--company');   // ширина по длине названия

    const criticalCount = Events.countBy(state.events, 'critical');
    tabNodes.events = createTab({
      label: 'События', labelFlag: '(в разработке)',
      value: criticalCount ? `${criticalCount} требуют внимания` : 'отклонений нет',
      index: 3, onClick: () => selectView('events'),
    });
    tabNodes.events.classList.add('tab--events');
    if (criticalCount) tabNodes.events.classList.add('has-alert');

    // фильтры событий — второй уровень, когда открыта вкладка «События»
    tabNodes.eventFilters = {};
    EVENT_FILTERS.forEach((filter, index) => {
      const count = Events.countBy(state.events, filter.code);
      tabNodes.eventFilters[filter.code] = createTab({
        label: filter.label, value: String(count), note: filter.note,
        index, onClick: () => selectEventFilter(filter.code),
      });
    });

    setRowTabs(companyTabs, [tabNodes.company, createIdentityPair(company), tabNodes.events]);

    // --- уровень 2
    const utilization = limits.total
      ? (limits.used / limits.total * 100).toFixed(1).replace('.', ',') : '0';

    tabNodes.sections = {
      main: createTab({
        label: 'Основная информация', value: profile.name,
        note: profile.group ? profile.group.name : 'без группы компаний',
        index: 0, onClick: () => selectSection('main'),
      }),
      statements: createTab({
        label: 'Финансовая отчётность', value: `${indicators.years[0]}–${indicators.years[indicators.years.length - 1]}`,
        note: 'Баланс · Фин. рез-ты · Коэф-ты',
        index: 1, onClick: () => selectSection('statements'),
      }),
      limits: createTab({
        label: 'Лимиты', value: Format.compact(limits.total),
        note: `утилизация ${utilization}%`, index: 2, onClick: () => selectSection('limits'),
      }),
      sublimits: createTab({
        label: 'Сублимиты', value: Format.compact(sublimits.total),
        note: `${sublimits.items.length} позиций`, index: 3, onClick: () => selectSection('sublimits'),
      }),
      reserves: createTab({
        label: 'Информация о резервах', value: Format.compact(reserves.total),
        note: 'РСБУ · МСФО', index: 4, onClick: () => selectSection('reserves'),
      }),
    };
    sectionTabs.replaceChildren(...Object.values(tabNodes.sections));

    // --- уровень 3: разделы отчётности
    tabNodes.groups = {};
    INDICATOR_GROUPS.forEach((group, index) => {
      const source = indicators.groups.find(item => item.code === group.code);
      tabNodes.groups[group.code] = createTab({
        value: group.title,
        note: source ? `${source.rows.length} показателей` : '',
        index,
        onClick: () => {
          state.group = group.code;
          syncTabs();
          renderContent();
        },
      });
    });

    // --- уровень 3: атрибутный состав карточки клиента
    // ИНН, ОГРН, адрес и ОКВЭД — справочные, кликается только группа компаний
    const attributeTabs = [
      { code: 'inn',     label: 'ИНН',   value: profile.inn },
      { code: 'ogrn',    label: 'ОГРН',  value: profile.ogrn || '—' },
      { code: 'address', label: 'Адрес', value: profile.address || '—' },
      { code: 'okved',   label: 'ОКВЭД', value: profile.okved || '—', note: profile.okved_name || '' },
    ];
    tabNodes.attributes = {};
    attributeTabs.forEach((attribute, index) => {
      tabNodes.attributes[attribute.code] = createTab({
        label: attribute.label, value: attribute.value, note: attribute.note,
        isStatic: true, index,
      });
    });

    // группа компаний: раскрывается, если есть; иначе «Отсутствует» на том же месте
    tabNodes.attributes.group = profile.group
      ? createTab({
          label: 'Группа компаний', value: profile.group.name,

          index: attributeTabs.length,
          onClick: () => {
            state.attribute = state.attribute === 'group' ? null : 'group';
            syncTabs();
            renderContent();
          },
        })
      : createTab({
          label: 'Группа компаний', value: 'Отсутствует',
          note: 'клиент не входит в ГК',
          isStatic: true, index: attributeTabs.length,
        });
  }

  /* ---------- синхронизация состояний ---------- */
  function syncTabs() {
    const companyOpen = state.view === 'company';
    const eventsOpen = state.view === 'events';
    const showStatements = companyOpen && state.section === 'statements';
    const showAttributes = companyOpen && state.section === 'main';
    const showGroups = showStatements || showAttributes;

    tabNodes.company.classList.toggle('is-active', companyOpen);
    tabNodes.company.noteElement.textContent = companyOpen ? 'Свернуть карточку' : 'Открыть карточку';
    tabNodes.events.classList.toggle('is-active', eventsOpen);

    // второй уровень показывает либо разделы компании, либо фильтры событий
    if (eventsOpen) {
      setRowTabs(sectionTabs, Object.values(tabNodes.eventFilters));
      Object.entries(tabNodes.eventFilters).forEach(([code, node]) =>
        node.classList.toggle('is-active', state.eventFilter === code));
    } else {
      setRowTabs(sectionTabs, Object.values(tabNodes.sections));
      Object.entries(tabNodes.sections).forEach(([code, node]) =>
        node.classList.toggle('is-active', state.section === code));
    }

    if (showAttributes) {
      setRowTabs(groupTabs, Object.values(tabNodes.attributes));
      if (tabNodes.attributes.group) {
        tabNodes.attributes.group.classList.toggle('is-active', state.attribute === 'group');
      }
    } else {
      setRowTabs(groupTabs, Object.values(tabNodes.groups));
      Object.entries(tabNodes.groups).forEach(([code, node]) =>
        node.classList.toggle('is-active', state.group === code));
    }

    setLevelVisible(sectionLevel, companyOpen || eventsOpen);
    setLevelVisible(groupLevel, showGroups);

    // сторона ветки: «Компания» — крайняя слева, «События» — крайняя справа.
    // Ни одна не выбрана — строка возвращается в центр.
    treeRoot.classList.toggle('branch-left', companyOpen);
    treeRoot.classList.toggle('branch-right', eventsOpen);

    // считаем после того, как браузер применил классы и состав строк
    requestAnimationFrame(() => {
      fitTopRow();
      layoutBranch();
    });
  }

  /* Меняет состав строки только когда он действительно другой —
     иначе повторялась бы анимация появления вкладок */
  function setRowTabs(row, nodes) {
    if (row.firstElementChild !== nodes[0] || row.childElementCount !== nodes.length) {
      row.replaceChildren(...nodes);
    }
  }

  /* ------------------------------------------------------------
     Геометрия уровней.

     Все строки — включая первую — выравниваются по одному краю:
     левому при раскрытии «Компании», правому при раскрытии «Событий».
     Цель фиксированная (граница поля контейнера), а не карточка, по
     которой кликнули, поэтому раскрытие «Финансовой отчётности» и
     «Основной информации» даёт одинаковую раскладку.

     Черта-указатель никаких вычислений не требует: она нарисована
     на краю контейнера средствами CSS и одинакова для всех уровней.

     offsetLeft читает положение ДО transform, поэтому измерения не
     зависят от текущей анимации сдвига.
     ------------------------------------------------------------ */
  const cssPx = name =>
    parseInt(getComputedStyle(treeRoot).getPropertyValue(name), 10) || 0;

  function offsetWithin(node, ancestor) {
    let x = 0;
    while (node && node !== ancestor) {
      x += node.offsetLeft;
      node = node.offsetParent;
    }
    return x;
  }

  function offsetWithinY(node, ancestor) {
    let y = 0;
    while (node && node !== ancestor) {
      y += node.offsetTop;
      node = node.offsetParent;
    }
    return y;
  }

  /* ------------------------------------------------------------
     Подбор ширины верхней строки.

     ИНН и КПП переносить нельзя — число, разорванное на две строки,
     читается как ошибка. Ширина подбирается в два подхода:

       1. вся карточка в одну строку (max-content) — идеальный вариант;
       2. если такая строка не помещается, берётся ширина самого длинного
          слова (min-content): длинное наименование переносится по пробелам,
          но ни слово, ни число не разрываются.

     Полученная ширина назначается обеим боковым вкладкам, поэтому они
     всегда одного размера; серый блок ИНН/КПП занимает столько, сколько
     нужно реквизитам. Если не помещается и второй вариант, замер
     не применяется.
     ------------------------------------------------------------ */
  const TAB_GAP = 12;

  function measureRow(mode) {
    companyTabs.classList.add(mode);
    const sides = [companyTabs.firstElementChild, companyTabs.lastElementChild];
    const needed = sides.reduce((max, tab) => Math.max(max, tab ? tab.offsetWidth : 0), 0);
    companyTabs.classList.remove(mode);
    return needed;
  }

  function fitTopRow() {
    const sides = [companyTabs.firstElementChild, companyTabs.lastElementChild];
    if (!sides[0] || sides[0] === sides[1]) return;

    companyTabs.style.removeProperty('--tab-min');
    companyTabs.style.removeProperty('max-width');
    if (!companyTabs.clientWidth) return;

    const pair = companyTabs.querySelector('.tab-pair');
    const pairWidth = pair ? pair.offsetWidth : 0;
    const normal = companyTabs.clientWidth;
    const roomy = treeRoot.clientWidth - 12;   // строка может занять поля под черту
    const rowWidth = width => width * 2 + pairWidth;

    // 1. лучший вариант: боковые вкладки целиком в одну строку
    const whole = measureRow('is-measuring-whole');
    // 2. запасной: не рвать слова и числа, но разрешить перенос по пробелам
    const unbroken = measureRow('is-measuring-word');

    let needed = 0;
    let useGutters = false;

    if (rowWidth(whole) <= normal) needed = whole;
    else if (rowWidth(whole) <= roomy) { needed = whole; useGutters = true; }
    else if (rowWidth(unbroken) <= normal) needed = unbroken;
    else if (rowWidth(unbroken) <= roomy) { needed = unbroken; useGutters = true; }
    else return;                                // не помещается и так

    if (useGutters) companyTabs.style.maxWidth = '100%';
    companyTabs.style.setProperty('--tab-min', Math.ceil(needed) + 'px');
  }

  /* Стрелки ставятся вплотную к крайним карточкам первой строки и
     сдвигаются на ту же величину, что и сама строка. */
  const ARROW_SIZE = 16;
  const ARROW_GAP = 14;

  function placeArrows(shift) {
    const first = companyTabs.firstElementChild;
    const last = companyTabs.lastElementChild;
    if (!arrowLeft || !first || !companyTabs.offsetWidth) return;

    const base = offsetWithin(companyTabs, treeRoot);
    const left = base + first.offsetLeft + shift;
    const right = base + last.offsetLeft + last.offsetWidth + shift;
    const middle = offsetWithinY(first, treeRoot) + first.offsetHeight / 2 - ARROW_SIZE / 2;

    arrowLeft.style.left = Math.round(left - ARROW_GAP - ARROW_SIZE) + 'px';
    arrowRight.style.left = Math.round(right + ARROW_GAP) + 'px';
    arrowLeft.style.top = arrowRight.style.top = Math.round(middle) + 'px';
  }

  /* ближний к ветке край крайней карточки строки */
  function nearEdge(row, toRight) {
    const tab = toRight ? row.lastElementChild : row.firstElementChild;
    if (!tab) return null;
    const x = offsetWithin(row, treeRoot) + tab.offsetLeft;
    return toRight ? x + tab.offsetWidth : x;
  }

  function layoutBranch() {
    const toRight = treeRoot.classList.contains('branch-right');
    const toLeft = treeRoot.classList.contains('branch-left');
    const rows = [companyTabs, sectionTabs, groupTabs];

    if (!toLeft && !toRight) {
      rows.forEach(row => { row.style.transform = ''; });
      placeArrows(0);
      return;
    }

    const gutter = cssPx('--marker-gutter');
    const target = toRight ? treeRoot.offsetWidth - gutter : gutter;
    const visible = new Set(visibleRows().map(entry => entry.row));

    rows.forEach(row => {
      // строка третьего уровня остаётся по центру: карточек в ней меньше,
      // и прижатая к краю она выглядела бы обрубленной
      if (row === groupTabs || !visible.has(row) || !row.offsetWidth) {
        row.style.transform = '';
        return;
      }
      const edge = nearEdge(row, toRight);
      if (edge === null) return;
      const shift = Math.round(target - edge);
      row.style.transform = shift ? `translateX(${shift}px)` : '';
      if (row === companyTabs) placeArrows(shift);
    });
  }

  function visibleRows() {
    const list = [{ row: companyTabs, branch: null }];
    if (sectionLevel.classList.contains('is-open')) {
      list.push({ row: sectionTabs, branch: sectionLevel.querySelector('.tab-branch') });
    }
    if (groupLevel.classList.contains('is-open')) {
      list.push({ row: groupTabs, branch: groupLevel.querySelector('.tab-branch') });
    }
    return list;
  }

  /* пересчёт при изменении ширины окна */
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      fitTopRow();
      layoutBranch();
    }, 120);
  });

  /* inert убирает скрытые уровни из обхода по Tab */
  function setLevelVisible(level, visible) {
    level.classList.toggle('is-open', visible);
    level.toggleAttribute('inert', !visible);
  }

  /* ---------- контент ---------- */
  function renderContent() {
    const data = state.data;
    let html = '';

    if (state.view === 'events') {
      html = TableViews.events(state.events, state.eventFilter);
    } else if (state.view === 'company') {
      if (state.section === 'main') {
        html = state.attribute === 'group' && data.profile.group
          ? TableViews.group(data.profile.group, {
              selectedId: state.groupSelection,
              currentId: state.company.id,
            })
          : TableViews.profile(data.profile);
      }
      else if (state.section === 'statements') html = TableViews.indicators(data.indicators, state.group);
      else if (state.section === 'limits')    html = TableViews.limits(data.limits);
      else if (state.section === 'sublimits') html = TableViews.sublimits(data.sublimits);
      else if (state.section === 'reserves')  html = TableViews.reserves(data.reserves);
    }

    contentArea.innerHTML = html;

    // выбор компании в структуре ГК: клик отмечает её, кнопка «Перейти» —
    // запускает полноценный запрос за данными выбранной компании
    contentArea.querySelectorAll('[data-company-id]').forEach(node =>
      node.addEventListener('click', () => {
        const id = +node.dataset.companyId;
        state.groupSelection = state.groupSelection === id ? null : id;
        renderContent();
      }));

    const goButton = contentArea.querySelector('[data-go]');
    if (goButton) {
      goButton.addEventListener('click', () => callbacks.openCompany(+goButton.dataset.go));
    }

    contentArea.style.animation = 'none';   // перезапуск анимации появления
    void contentArea.offsetWidth;
    contentArea.style.animation = '';
  }

  /* ---------- взаимодействие ---------- */
  /* Один клик раскрывает ровно один уровень: карточка компании
     показывает строку разделов и ничего не выбирает в ней, раздел
     показывает свою строку — и так далее вглубь. */
  function selectView(view) {
    state.view = state.view === view ? null : view;
    state.section = null;
    state.attribute = null;
    state.groupSelection = null;
    if (state.view === 'events') state.eventFilter = 'critical';   // по умолчанию — критичные
    syncTabs();
    renderContent();
  }

  function selectEventFilter(code) {
    state.eventFilter = code;
    syncTabs();
    renderContent();
  }

  function selectSection(section) {
    state.section = state.section === section ? null : section;
    state.attribute = null;
    state.groupSelection = null;
    syncTabs();
    renderContent();
  }

  /* ---------- публичный интерфейс ---------- */
  function render(company, data) {
    Object.assign(state, {
      company, data,
      events: Events.detect(data),
      view: null, section: null, group: 'balance', eventFilter: 'critical',
      attribute: null, groupSelection: null,
    });
    treeRoot.hidden = false;
    buildTabs();
    companyLevel.classList.add('is-open');
    syncTabs();
    renderContent();
  }

  function clear() {
    treeRoot.hidden = true;
    companyTabs.style.removeProperty('--tab-min');
    treeRoot.classList.remove('branch-left', 'branch-right');
    companyLevel.classList.remove('is-open');
    setLevelVisible(sectionLevel, false);
    setLevelVisible(groupLevel, false);
    contentArea.innerHTML = '';
    Object.assign(state, {
      company: null, data: null, events: [], view: null, section: null,
      group: 'balance', eventFilter: 'critical', attribute: null, groupSelection: null,
    });
  }

  return {
    render, clear,
    onOpenCompany: fn => { callbacks.openCompany = fn; },
  };
})();

</script>
<script>
/* ============================================================
   Сборка: поиск -> «Обработка» -> дерево вкладок -> выгрузка.
   ============================================================ */
(() => {
  const byId = id => document.getElementById(id);

  const resultPanel = byId('resultPanel'),
        processing = byId('processingIndicator'),
        processingNote = byId('processingNote'),
        errorBox = byId('errorBox'),
        errorMessage = byId('errorMessage'),
        actionBar = byId('actionBar'),
        exportButton = byId('exportButton'),
        statusChip = byId('statusChip');

  let loaded = null;             // { company, data } — то, что показано и выгружается
  let hideActionBarTimer = null; // отложенное скрытие панели

  SearchBar.onSubmit(loadCompany);

  /* Переход на карточку другой компании из структуры ГК.
     Это полноценный новый запрос — тот же цикл, что и при поиске:
     «Обработка», параллельная загрузка всех разделов, сборка дерева.
     Прежние данные не переиспользуются. */
  TabTree.onOpenCompany(async companyId => {
    document.body.classList.add('is-searching');
    resultPanel.classList.add('is-visible');
    TabTree.clear();
    hideActionBar();
    errorBox.classList.remove('is-visible');
    processing.classList.add('is-visible');
    processingNote.textContent = 'Открываем карточку компании';
    window.scrollTo({ top: 0, behavior: 'smooth' });

    try {
      const company = await API.company(companyId);
      if (!company) throw new Error('Компания не найдена');
      await loadCompany(company);
    } catch (error) {
      processing.classList.remove('is-visible');
      errorMessage.textContent =
        'Не удалось открыть карточку выбранной компании. Проверьте соединение с базой и повторите.';
      errorBox.classList.add('is-visible');
      console.error(error);
    }
  });
  byId('retryButton').addEventListener('click', () => loaded && loadCompany(loaded.company));
  byId('resetButton').addEventListener('click', resetView);
  exportButton.addEventListener('click', downloadExcel);

  async function loadCompany(company) {
    loaded = { company, data: null };
    document.body.classList.add('is-searching');
    resultPanel.classList.add('is-visible');
    TabTree.clear();
    hideActionBar();
    errorBox.classList.remove('is-visible');
    processing.classList.add('is-visible');
    processingNote.textContent = `Собираем данные по «${company.name}»`;
    SearchBar.setBusy(true);

    try {
      // все ветки дерева тянем параллельно
      const [profile, indicators, limits, sublimits, reserves] = await Promise.all([
        API.profile(company.id),
        API.indicators(company.id),
        API.limits(company.id),
        API.sublimits(company.id),
        API.reserves(company.id),
      ]);
      const data = { profile, indicators, limits, sublimits, reserves };
      loaded = { company, data };

      processing.classList.remove('is-visible');
      TabTree.render(company, data);
      showActionBar();
    } catch (error) {
      processing.classList.remove('is-visible');
      errorMessage.textContent =
        `Не удалось получить данные по компании «${company.name}». Проверьте соединение с базой и повторите.`;
      errorBox.classList.add('is-visible');
      console.error(error);
    } finally {
      SearchBar.setBusy(false);
    }
  }

  /* ---------- плавающая панель ----------
     Скрытие отложено на время анимации, поэтому таймер обязательно
     снимается при показе: иначе при быстром ответе API панель успевала
     появиться и тут же пряталась сработавшим таймером. */
  function showActionBar() {
    clearTimeout(hideActionBarTimer);
    hideActionBarTimer = null;
    actionBar.hidden = false;
    requestAnimationFrame(() => actionBar.classList.add('is-visible'));
    updateFreshness();
  }

  function hideActionBar() {
    clearTimeout(hideActionBarTimer);
    actionBar.classList.remove('is-visible');
    hideActionBarTimer = setTimeout(() => {
      actionBar.hidden = true;
      hideActionBarTimer = null;
    }, 350);
  }

  /* Когда справочник компаний обновлялся последний раз.
     Если бэкенда нет — честно говорим, что данные демонстрационные. */
  async function updateFreshness() {
    if (API.isOffline()) {
      statusChip.textContent = 'демо-данные';
      statusChip.className = 'status-chip is-warning';
      statusChip.title = 'Бэкенд не отвечает, показаны демо-данные';
      statusChip.hidden = false;
      return;
    }

    const meta = await API.meta();
    const stamp = meta && meta.directory && meta.directory.updated_at;
    if (!stamp) { statusChip.hidden = true; return; }

    const moment = new Date(stamp);
    const isToday = moment.toDateString() === new Date().toDateString();
    const time = moment.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const day = moment.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });

    statusChip.textContent = `Последнее обновление ${isToday ? time : day + ' ' + time}`;
    statusChip.className = 'status-chip is-fresh';
    statusChip.title = `Справочник: ${meta.directory.count} компаний · ${moment.toLocaleString('ru-RU')}`;
    statusChip.hidden = false;
  }

  /* ---------- выгрузка ----------
     Вкладка «События» в файл не попадает: это аналитика на лету,
     а не таблица из базы. */
  function downloadExcel() {
    if (!loaded || !loaded.data) return;
    const label = exportButton.lastChild;
    const previousLabel = label.textContent;
    exportButton.disabled = true;
    label.textContent = ' Формируем файл…';
    try {
      ExcelExport.download(loaded.company, loaded.data, API.isOffline());
    } catch (error) {
      console.error('Не удалось сформировать файл:', error);
      alert('Не удалось сформировать файл. Подробности в консоли.');
    } finally {
      label.textContent = previousLabel;
      exportButton.disabled = false;
    }
  }

  function resetView() {
    document.body.classList.remove('is-searching');
    resultPanel.classList.remove('is-visible');
    hideActionBar();
    setTimeout(() => {
      TabTree.clear();
      errorBox.classList.remove('is-visible');
    }, 400);
    loaded = null;
    SearchBar.reset();
  }
})();

</script>
</body>
</html>
