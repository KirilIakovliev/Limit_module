# ============================================================
# Два сервиса с разным назначением.
#
# traefik — NodePort: точка входа снаружи. 30080 доступен на
# КАЖДОМ узле кластера, независимо от того, где живёт под Traefik.
#
# traefik-dashboard — ClusterIP: дашборд намеренно не публикуется,
# доступ через kubectl port-forward. На дашборде видна вся
# маршрутизация кластера, наружу его выставлять не нужно.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      nodePort: 30080
    - name: websecure
      port: 443
      targetPort: websecure
      nodePort: 30443
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: traefik
      port: 9000
      targetPort: traefik
