# ============================================================
# Alembic: схема app.load_log. Витрины t_lm_* этот Job не трогает.
#
# Применять после Postgres, до Deployment API.
# Повторный apply того же Job-имени не перезапустит finished Job —
# удалите Job и примените снова, либо смените имя.
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: abb-alembic
  namespace: abb
  labels:
    app: abb-alembic
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$POSTGRES_HOST" -p "${POSTGRES_PORT:-5432}" -U "$POSTGRES_USER"; do
                echo "жду базу $POSTGRES_HOST..."
                sleep 2
              done
              echo "база готова"
          envFrom:
            - secretRef:
                name: abb-db
      containers:
        - name: alembic
          image: abb-limit-module:0.2.0
          imagePullPolicy: IfNotPresent
          workingDir: /srv
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: abb-config
            - secretRef:
                name: abb-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
