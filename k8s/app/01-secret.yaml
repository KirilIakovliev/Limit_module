# ============================================================
# Пароли базы.
#
# В Compose они лежали в .env. Здесь — Secret. Важно понимать:
# Secret в Kubernetes НЕ зашифрован, это base64 (stringData ниже
# кодируется автоматически). Любой, у кого есть права читать
# секреты в namespace, прочитает пароль.
#
# Для банковского контура заменить на одно из:
#   - Sealed Secrets / SOPS (секрет в git в зашифрованном виде)
#   - Vault с инжектором
#   - шифрование etcd на уровне кластера (EncryptionConfiguration)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: abb-db
  namespace: abb
type: Opaque
stringData:
  POSTGRES_USER: "abb"
  POSTGRES_PASSWORD: "ЗАМЕНИТЬ_ПЕРЕД_РАЗВЁРТЫВАНИЕМ"
  POSTGRES_DB: "abb"
  # Строка подключения собрана целиком: приложение ждёт готовый DSN.
  # Хост abb-postgres — имя Service, DNS кластера резолвит его сам.
  DATABASE_URL: "postgresql://abb:ЗАМЕНИТЬ_ПЕРЕД_РАЗВЁРТЫВАНИЕМ@abb-postgres:5432/abb"
