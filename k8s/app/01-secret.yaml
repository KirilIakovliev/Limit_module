# ============================================================
# Подключение к Postgres. Пароль не хранить в git — подставить перед apply.
#
# Стенд:  t-lmts1-pdb51.base.akbars.ru / limitmodule / limitmodule_test
# Прод:   сменить POSTGRES_HOST (и при необходимости USER).
# Приложение собирает DSN из этих переменных (см. api/app/db.py).
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: abb-db
  namespace: abb
type: Opaque
stringData:
  POSTGRES_HOST: "t-lmts1-pdb51.base.akbars.ru"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "limitmodule"
  POSTGRES_USER: "limitmodule_test"
  POSTGRES_PASSWORD: ""
