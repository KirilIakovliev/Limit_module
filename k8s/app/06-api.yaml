# ============================================================
# API приложения.
#
# Соответствие с docker-compose:
#   build: ./api          -> image: abb-limit-module:0.2.0 (собран заранее)
#   environment:          -> envFrom: configMapRef + secretRef
#   depends_on: healthy   -> initContainer wait-for-db
#   ports: 8000           -> Service abb-api + Ingress
#   volumes: ./web, ./db  -> вшиты в образ, томов нет
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abb-api
  namespace: abb
  labels:
    app: abb-api
spec:
  replicas: 2                     # API без состояния, реплики масштабируются свободно
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0           # при обновлении не терять доступность
      maxSurge: 1
  selector:
    matchLabels:
      app: abb-api
  template:
    metadata:
      labels:
        app: abb-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # ------------------------------------------------------
      # Аналог depends_on: condition: service_healthy.
      # Без него под падает в CrashLoopBackOff: приложение при старте
      # ждёт базу 30 секунд (db_pool.wait) и завершается с PoolTimeout,
      # если не дождалось. initContainer ждёт столько, сколько нужно,
      # и основной контейнер стартует уже наверняка.
      # ------------------------------------------------------
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h abb-postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "жду базу..."
                sleep 2
              done
              echo "база готова"
          envFrom:
            - secretRef:
                name: abb-db
      containers:
        - name: api
          image: abb-limit-module:0.2.0
          imagePullPolicy: IfNotPresent    # образ импортирован на узлы вручную
          envFrom:
            - configMapRef:
                name: abb-config
            - secretRef:
                name: abb-db
          ports:
            - name: http
              containerPort: 8000
          # /api/health возвращает 200 даже при status: degraded —
          # это сознательно: сервис жив и отдаёт фронтенд, даже если
          # база недоступна. Для readiness этого достаточно; если
          # понадобится снимать под с трафика при падении базы,
          # добавьте отдельный /api/ready, проверяющий db: true.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 20
            periodSeconds: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: abb-api
  namespace: abb
spec:
  type: ClusterIP                 # наружу выходим только через Traefik
  selector:
    app: abb-api
  ports:
    - name: http
      port: 8000
      targetPort: http
