# ============================================================
#   docker compose up --build          -> http://localhost:8000  (nginx: UI)
#   API напрямую                         http://localhost:8001
# Подключение: POSTGRES_HOST / USER / PASSWORD / DB / PORT из .env
# Локально хост по умолчанию `db`. Стенд: t-lmts1-pdb51.base.akbars.ru
# ============================================================
x-pg: &pg
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-limitmodule}
  POSTGRES_USER: ${POSTGRES_USER:-limitmodule_test}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}

services:
  db:
    image: postgres:16-alpine
    container_name: abb-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-limitmodule_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_DB:-limitmodule}
    volumes:
      # снимок витрин и фикстуры — только локально, только пустой том
      - ./db/local:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-limitmodule_test} -d ${POSTGRES_DB:-limitmodule}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./api
    container_name: abb-migrate
    environment:
      <<: *pg
    volumes:
      - ./api/app:/srv/app:ro
      - ./api/alembic:/srv/alembic:ro
      - ./api/alembic.ini:/srv/alembic.ini:ro
    depends_on:
      db: { condition: service_healthy }
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.seed_local

  api:
    build: ./api
    container_name: abb-api
    environment:
      <<: *pg
      REPLICA_SCHEMA: ${REPLICA_SCHEMA:-sbox_rsk_drt}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - ./api/app:/srv/app:ro
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "8001:8000"

  # Локальный nginx. На стенде его нет: там уже стоит host nginx.
  # Образ не тянуть из docker.io, если он уже есть локально.
  web:
    image: nginx:1.27-alpine
    pull_policy: never
    container_name: abb-web
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./web/old-prototype:/usr/share/nginx/legacy-root/old-prototype:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_started }
    ports:
      - "8000:80"

volumes:
  pgdata:
